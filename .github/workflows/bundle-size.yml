name: Bundle Size Check

on:
  pull_request:
    branches: [main]

jobs:
  bundle-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup environment
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> $GITHUB_ENV
      
      - name: Build and analyze
        run: npm run build
      
      - name: Get bundle sizes
        id: bundle-size
        run: |
          echo "Analyzing bundle sizes..."
          
          # Get main chunk size
          if ls .next/static/chunks/main-*.js 1> /dev/null 2>&1; then
            MAIN_SIZE=$(du -sh .next/static/chunks/main-*.js | cut -f1)
            MAIN_BYTES=$(du -sb .next/static/chunks/main-*.js | cut -f1)
          else
            MAIN_SIZE="N/A"
            MAIN_BYTES=0
          fi
          
          # Get app chunks total
          if ls .next/static/chunks/app/*.js 1> /dev/null 2>&1; then
            APP_SIZE=$(du -sh .next/static/chunks/app | cut -f1)
            APP_BYTES=$(du -sb .next/static/chunks/app | cut -f1)
          else
            APP_SIZE="N/A"
            APP_BYTES=0
          fi
          
          # Get total static size
          TOTAL_SIZE=$(du -sh .next/static | cut -f1)
          TOTAL_BYTES=$(du -sb .next/static | cut -f1)
          
          echo "main_size=$MAIN_SIZE" >> $GITHUB_OUTPUT
          echo "main_bytes=$MAIN_BYTES" >> $GITHUB_OUTPUT
          echo "app_size=$APP_SIZE" >> $GITHUB_OUTPUT
          echo "app_bytes=$APP_BYTES" >> $GITHUB_OUTPUT
          echo "total_size=$TOTAL_SIZE" >> $GITHUB_OUTPUT
          echo "total_bytes=$TOTAL_BYTES" >> $GITHUB_OUTPUT
          
          # List largest chunks
          echo "largest_chunks<<EOF" >> $GITHUB_OUTPUT
          find .next/static/chunks -name "*.js" -type f -exec du -h {} + | sort -rh | head -10 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Check bundle size limits
        id: check-limits
        run: |
          MAIN_BYTES=${{ steps.bundle-size.outputs.main_bytes }}
          APP_BYTES=${{ steps.bundle-size.outputs.app_bytes }}
          
          # Limits (in bytes)
          MAIN_LIMIT=204800  # 200KB
          APP_LIMIT=512000   # 500KB
          
          STATUS="✅ PASS"
          WARNINGS=""
          
          if [ "$MAIN_BYTES" -gt "$MAIN_LIMIT" ]; then
            OVER=$((MAIN_BYTES - MAIN_LIMIT))
            OVER_KB=$((OVER / 1024))
            WARNINGS="${WARNINGS}\n⚠️ Main chunk exceeds limit by ${OVER_KB}KB"
            STATUS="⚠️ WARNING"
          fi
          
          if [ "$APP_BYTES" -gt "$APP_LIMIT" ]; then
            OVER=$((APP_BYTES - APP_LIMIT))
            OVER_KB=$((OVER / 1024))
            WARNINGS="${WARNINGS}\n⚠️ App chunks exceed limit by ${OVER_KB}KB"
            STATUS="⚠️ WARNING"
          fi
          
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "warnings<<EOF" >> $GITHUB_OUTPUT
          echo -e "$WARNINGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const mainSize = '${{ steps.bundle-size.outputs.main_size }}';
            const appSize = '${{ steps.bundle-size.outputs.app_size }}';
            const totalSize = '${{ steps.bundle-size.outputs.total_size }}';
            const status = '${{ steps.check-limits.outputs.status }}';
            const warnings = `${{ steps.check-limits.outputs.warnings }}`;
            const largestChunks = `${{ steps.bundle-size.outputs.largest_chunks }}`;
            
            let comment = `## 📦 Bundle Size Report\n\n`;
            comment += `**Overall Status:** ${status}\n\n`;
            comment += `### Bundle Sizes\n\n`;
            comment += `| Chunk | Size | Limit | Status |\n`;
            comment += `|-------|------|-------|--------|\n`;
            comment += `| Main | ${mainSize} | 200KB | ${mainSize.includes('K') && parseInt(mainSize) > 200 ? '⚠️' : '✅'} |\n`;
            comment += `| App | ${appSize} | 500KB | ${appSize.includes('K') && parseInt(appSize) > 500 ? '⚠️' : '✅'} |\n`;
            comment += `| Total Static | ${totalSize} | 2MB | ${totalSize.includes('M') && parseInt(totalSize) > 2 ? '⚠️' : '✅'} |\n\n`;
            
            if (warnings.trim()) {
              comment += `### ⚠️ Warnings\n\n${warnings}\n\n`;
            }
            
            comment += `<details>\n<summary>📊 Top 10 Largest Chunks</summary>\n\n\`\`\`\n${largestChunks}\n\`\`\`\n\n</details>\n\n`;
            comment += `---\n`;
            comment += `💡 **Tip:** Use \`npm run analyze:bundle\` to investigate bundle composition\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
